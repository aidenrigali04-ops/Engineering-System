# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evalgate
      POSTGRES_PASSWORD: evalgate
      POSTGRES_DB: evalgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalgate"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
