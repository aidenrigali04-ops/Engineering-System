name: CI

# Run on proposed changes and on main itself. The pull_request trigger is what
# produces the checks that gate merging; the push trigger catches anything that
# reaches main another way and keeps the default branch's status honest.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Grant the job token the least it needs. The default is broader than this.
permissions:
  contents: read

# A new push to a branch makes the previous run obsolete, so cancel it rather
# than paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json specifies and fails if
      # the lockfile disagrees with package.json. npm install would silently
      # resolve new versions, which is how CI and local machines drift apart.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kept as separate steps so a failure names the tool that failed rather
      # than reporting one opaque red job.
      - name: Lint JavaScript
        run: npm run lint

      - name: Lint markdown
        run: npm run lint:md

      - name: Check formatting
        run: npm run format:check

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # --offline resolves relative links against the checkout and skips the
      # network entirely, so this fails only on genuinely broken links rather
      # than on someone else's server being slow.
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --verbose "**/*.md"
          fail: true

  branch-name:
    name: Branch name
    # Only meaningful for a pull request, where a source branch exists.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The branch name is passed through the environment rather than
      # interpolated into the command. A branch name is attacker-controlled
      # text, and ${{ }} substitution happens before the shell sees the line,
      # so interpolating it directly would let a crafted name run commands.
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: node scripts/check-branch-name.js "$BRANCH_NAME"
